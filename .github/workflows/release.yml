name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      checksum: ${{ steps.checksum.outputs.checksum }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag and VERSION must match"; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Remove dev files from release
        run: |
          rm -rf node_modules
          rm -rf tests
          rm -rf .github
          rm -rf blueprints
          rm -rf .claude
          rm -f .env.example.backup
          rm -f phpunit.xml
          rm -f vite.config.ts
          rm -f tsconfig*.json
          rm -f tailwind.config.*
          rm -f postcss.config.*
          rm -f eslint.config.*
          rm -f components.json

      - name: Create release archive
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, zipfile
          root = pathlib.Path.cwd()
          version = (root / 'VERSION').read_text().strip()
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / f'artisancms-{version}.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as output:
              for path in sorted(root.rglob('*')):
                  name = path.relative_to(root).as_posix()
                  if path.is_symlink() or '.git' in path.parts or path.is_dir():
                      continue
                  if (name == '.env' or (name.startswith('.env.') and name != '.env.example')
                      or name == 'public/hot' or name.startswith('public/storage/')):
                      continue
                  if name.startswith(('storage/', 'bootstrap/cache/')) and path.name != '.gitignore':
                      continue
                  output.write(path, name)
          shutil.move(str(archive), str(root / archive.name))
          PY

      - name: Generate SHA-256 checksum
        id: checksum
        run: |
          sha256sum artisancms-${{ steps.version.outputs.version }}.zip > artisancms-${{ steps.version.outputs.version }}.sha256
          echo "checksum=$(cat artisancms-${{ steps.version.outputs.version }}.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges HEAD)
          else
            CHANGELOG=$(git log --oneline --no-merges ${PREV_TAG}..HEAD)
          fi
          # Write to file for the release body
          echo "$CHANGELOG" > CHANGELOG_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ArtisanCMS v${{ steps.version.outputs.version }}
          body_path: CHANGELOG_BODY.md
          files: |
            artisancms-${{ steps.version.outputs.version }}.zip
            artisancms-${{ steps.version.outputs.version }}.sha256
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') }}

  # Update the registry API with the new version
  notify-registry:
    name: Notify Registry
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-beta') && !contains(github.ref, '-rc') && !contains(github.ref, '-alpha') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Notify registry of new release
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_API_KEY: ${{ secrets.REGISTRY_API_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_CHECKSUM: ${{ needs.release.outputs.checksum }}
        run: |
          if [ -z "$REGISTRY_URL" ] || [ -z "$REGISTRY_API_KEY" ]; then
            echo "Registry notification skipped: REGISTRY_URL or REGISTRY_API_KEY not configured."
            exit 0
          fi
          jq -n --arg version "$RELEASE_VERSION" --arg tag "$RELEASE_TAG" \
            --arg url "https://github.com/$RELEASE_REPO/releases/download/$RELEASE_TAG/artisancms-$RELEASE_VERSION.zip" \
            --arg checksum "$RELEASE_CHECKSUM" --rawfile changelog CHANGELOG.md \
            '{type:"cms",version:$version,tag:$tag,download_url:$url,checksum_sha256:$checksum,changelog:$changelog,php_required:"8.3.0"}' > release.json
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $REGISTRY_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @release.json \
            "${REGISTRY_URL%/}/api/internal/releases"
